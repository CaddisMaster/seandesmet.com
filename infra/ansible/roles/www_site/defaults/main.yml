# seandesmet.com on the shared Droplet: the Nginx site, its web root, the headers
# snippet and the deploy's forced command. The page is deploy.yml's, the deploy key's
# authorized_keys line is droplet-infra's inventory's, and the certificate is Certbot's.
www_site_name: seandesmet.com
www_site_root: /var/www/seandesmet.com
www_site_user: deploy
www_site_snippet: /etc/nginx/snippets/seandesmet-security-headers.conf
www_site_landing_deploy: /usr/local/bin/landing-deploy
