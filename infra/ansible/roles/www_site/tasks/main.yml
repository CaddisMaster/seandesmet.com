# The site file, the snippet and landing-deploy are production's, byte for byte
# (compared on the Droplet 2026-11-03, #44). This role never writes the page, which
# arrives through landing-deploy, or the certificate, which it only checks.
- name: The web root
  ansible.builtin.file:
    path: "{{ www_site_root }}"
    state: directory
    owner: "{{ www_site_user }}"
    group: "{{ www_site_user }}"
    mode: "0755"

- name: Look at the certificate files the www site names
  ansible.builtin.stat:
    path: "{{ item }}"
    get_checksum: false
  loop:
    - /etc/letsencrypt/live/{{ www_site_name }}/fullchain.pem
    - /etc/letsencrypt/live/{{ www_site_name }}/privkey.pem
    - /etc/letsencrypt/options-ssl-nginx.conf
    - /etc/letsencrypt/ssl-dhparams.pem
  register: www_site_files

- name: The www site's certificate files exist
  ansible.builtin.assert:
    that: item.stat.exists
    fail_msg: >-
      {{ item.item }} is missing. This role doesn't write the certificate: see
      budget-buddy's RUNBOOK §4, then run again.
    quiet: true
  loop: "{{ www_site_files.results }}"
  loop_control:
    label: "{{ item.item }}"

# The contract with index.html: scripts/check-csp.sh enforces the page's side.
- name: The headers snippet
  ansible.builtin.copy:
    src: seandesmet-security-headers.conf
    dest: "{{ www_site_snippet }}"
    owner: root
    group: root
    mode: "0644"
  notify: www site changed

# The only thing the landing deploy key can run, so it is a security boundary.
- name: The deploy's forced command
  ansible.builtin.copy:
    src: landing-deploy
    dest: "{{ www_site_landing_deploy }}"
    owner: root
    group: root
    mode: "0755"

- name: The www site
  ansible.builtin.copy:
    src: "{{ www_site_name }}"
    dest: /etc/nginx/sites-available/{{ www_site_name }}
    owner: root
    group: root
    mode: "0644"
  notify: www site changed

- name: The www site is enabled
  ansible.builtin.file:
    src: /etc/nginx/sites-available/{{ www_site_name }}
    dest: /etc/nginx/sites-enabled/{{ www_site_name }}
    state: link
  notify: www site changed

# Now, not at the end of the play: a later role's refusal would otherwise leave a
# changed file unreloaded, and the next run would see no change to act on.
- name: Apply a www site change before the next role
  ansible.builtin.meta: flush_handlers
