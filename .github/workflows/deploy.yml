name: Deploy

# Push to main IS the deploy. The page has no versions and no release notes, so
# there is nothing for a GitHub Release to carry — the reason budget-buddy gates
# on one does not apply here.
#
# This exists because the manual copy it replaces failed twice on 2026-08-24
# (CaddisMaster/budget-buddy#288, #291): the fix was merged, the page was not
# updated, and nothing said so until a drift check noticed.
on:
  push:
    branches: [main]
    # The workflow itself is included so a change to the check below validates
    # itself on the way in. The deploy that follows is idempotent — it re-sends
    # bytes the box already has and verifies them.
    paths:
      - 'index.html'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

# Two pushes deploying at once would race on the same file on the box. Never
# cancel one in flight — a cancelled transfer can leave a partial file served.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Gates the deploy: a page naming a library the app no longer uses must never
  # reach production. This came from budget-buddy#291, where the card advertised
  # Chart.js for four releases after the app dropped it — nothing read this file,
  # so nothing could catch it. The check lived in that repo's test suite until
  # #299; it moved here with the page.
  check:
    name: The tech stack names nothing retired
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: No stack tag names a retired library
        run: |
          set -euo pipefail

          # `|| true` on both: with `set -e` + `pipefail`, a selector that matches
          # nothing would abort here — exiting 1 with NO explanation, right before
          # the error message that says why. Fail loudly, not silently.
          tags=$(grep -oE '<span class="stack-tag">[^<]*</span>' index.html \
                 | sed -E 's#.*>(.*)<.*#\1#' || true)
          count=$(printf '%s\n' "$tags" | grep -c . || true)

          # Quoted, so a two-word tag stays one line. Unquoted, `Let's Encrypt`
          # prints as two entries and the listing contradicts the count.
          echo "stack tags found ($count):"
          printf '%s\n' "$tags" | sed 's/^/  /'

          # ⚠️ THE LOAD-BEARING ASSERTION. Without it, a renamed class or a
          # rewritten card makes the selector match nothing, `tags` is empty, the
          # loop below runs zero times, and the check passes while asserting
          # nothing at all. An absence test that cannot fail is worse than none.
          if [ "$count" -lt 5 ]; then
            echo "::error::Only $count stack tags matched — the selector no longer" \
                 "fits the markup, so this check is not actually reading the stack."
            exit 1
          fi

          # Front-end libraries the app has retired. Naming one here is a factual
          # claim about what Budget Buddy uses, and it is wrong.
          RETIRED='chart.js'

          lower=$(printf '%s\n' "$tags" | tr '[:upper:]' '[:lower:]')
          for r in $RETIRED; do
            # -x: whole-line match, so a tag merely containing the name is not a
            # false positive.
            if printf '%s\n' "$lower" | grep -qx "$r"; then
              echo "::error::The tech stack advertises retired '$r'. Budget Buddy" \
                   "dropped it at 0.8.0 (budget-buddy#234) for ApexCharts."
              exit 1
            fi
          done

          echo "No retired library named."

  deploy:
    name: Copy to the Droplet and verify it is live
    runs-on: ubuntu-latest
    # Nothing ships unless the check above passed.
    needs: check
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DROPLET_KNOWN_HOSTS }}
          HOST: ${{ secrets.DROPLET_HOST }}
          USER_NAME: ${{ vars.DROPLET_USER }}
        run: |
          # Fail closed, and name which one is missing. A half-configured deploy
          # that "succeeds" while copying nothing is the failure mode this whole
          # workflow exists to remove, so an unset secret must be loud.
          for v in SSH_KEY KNOWN_HOSTS HOST USER_NAME; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is not configured. See README.md -> Deploy setup."
              exit 1
            fi
          done

          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key. StrictHostKeyChecking=no would accept anything
          # answering on that address, which is the whole attack this prevents.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          # The key is restricted to ONE forced command on the box, which reads a
          # tarball on stdin and extracts it into the web root. Nothing here
          # names a destination path: the server decides where bytes land, so a
          # leaked key cannot write anywhere else. See README.md.
          tar -czf - index.html \
            | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
                  "${USER_NAME}@${HOST}"
          echo "index.html sent ($(stat -c%s index.html) bytes)"

      - name: Scrub the key
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Verify the live page is the file we just pushed
        run: |
          # ⚠️ A PRESENCE check, deliberately. Asserting only that something is
          # absent passes just as happily against an nginx error page, which is
          # exactly the state a broken deploy produces.
          #
          # Compare through a FILE, never through $(...): command substitution
          # strips trailing newlines, so a page that is genuinely byte-identical
          # hashes one byte short of index.html and this check can never pass.
          for i in $(seq 1 10); do
            if curl -fsS --max-time 10 https://seandesmet.com/ -o live.html \
               && [ -s live.html ] \
               && cmp -s live.html index.html; then
              echo "Live page is byte-identical to index.html."
              rm -f live.html
              exit 0
            fi
            echo "attempt $i: not matching yet"
            sleep 5
          done
          rm -f live.html
          echo "::error::Deploy finished but https://seandesmet.com/ does not match index.html."
          exit 1
